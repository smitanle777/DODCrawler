name: Build Windows Executable January

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.8.9  # Change to your Python version

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      # Step 4: Build the executable
      - name: Build executable
        run: |
          pyinstaller --onefile defensecrawler.py  # Replace with your script

      # Step 5: Upload the built artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: WindowsExecutable
          path: dist/defensecrawler.exe  # Adjust path if needed
