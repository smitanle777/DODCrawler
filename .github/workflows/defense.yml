name: Build Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium requests openai pyinstaller
        
    - name: Build executable
      run: |
        pyinstaller --onefile --hidden-import=requests --hidden-import=selenium --hidden-import=openai defensecrawler.py
        
    - name: Create batch file using PowerShell
      run: |
        mkdir output
        Set-Content -Path output\run_defensecrawler.bat -Value "@echo off`nstart `"`" /B defensecrawler.exe`npause"
        move dist\defensecrawler.exe output\defensecrawler.exe
  
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: defensecrawler-executable
        path: output/
